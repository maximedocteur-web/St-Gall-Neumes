<!-- Script principal -->
    <script>
        // =========================================================
        // 1. FONCTIONS GLOBALES (Accessibles par les boutons HTML)
        // =========================================================

        // Gestion de la navigation par pages
        function showPage(pageName) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));

            const targetSection = document.getElementById('page-' + pageName);
            
            if (targetSection) {
                targetSection.classList.add('active');
            } else {
                console.warn("Attention: La page HTML pour '" + pageName + "' n'existe pas !");
            }

            // Gestion de l'apparence du bouton Accueil
            const btnAccueil = document.getElementById('nav-accueil');
            if(btnAccueil) {
                if (pageName === 'accueil') {
                    btnAccueil.className = "px-3 py-1.5 rounded-md transition bg-amber-700 text-white font-medium";
                } else {
                    btnAccueil.className = "px-3 py-1.5 rounded-md transition text-stone-700 hover:bg-stone-100";
                }
            }
            
            // Remonter en haut de la page
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Gestion de la barre de navigation
            const navContainer = document.getElementById('nav-container');
            const mainNav = document.getElementById('main-nav');
            
            if (pageName === 'accueil') {
                if (navContainer) navContainer.className = "sticky top-0 z-50 w-full pt-0 xl:pt-4 pointer-events-none transition-all duration-300";
                if (mainNav) mainNav.className = "max-w-5xl mx-auto bg-white border border-stone-200 shadow-md xl:rounded-xl pointer-events-auto transition-all duration-300";
            } else {
                if (navContainer) navContainer.className = "sticky top-0 z-50 w-full pointer-events-auto transition-all duration-300";
                if (mainNav) mainNav.className = "w-full bg-white border-b border-stone-200 shadow-sm transition-all duration-300";
            }
        }

        // Gestion des onglets de Neumes
        function switchNeumeTab(category) {
            document.querySelectorAll('.neume-tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + category).classList.remove('hidden');

            ['simples', 'ornementaux'].forEach(cat => {
                const btn = document.getElementById('btn-' + cat);
                if(btn) {
                    if(cat === category) {
                        btn.className = "px-4 py-2 bg-amber-700 text-white rounded-md font-medium text-sm transition";
                    } else {
                        btn.className = "px-4 py-2 bg-stone-200 text-stone-700 rounded-md font-medium text-sm transition hover:bg-stone-300";
                    }
                }
            });
        }

        // Recherche de neumes
        function filterNeumes() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const cards = document.querySelectorAll('.neume-card');
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(query) ? 'block' : 'none';
            });
        }

        // Vérification du Quiz
        function checkQuiz() {
            const selected = document.querySelector('input[name="quiz-q"]:checked');
            const resultEl = document.getElementById('quiz-result');
            if (!selected) {
                resultEl.textContent = "Veuillez sélectionner une réponse.";
                resultEl.className = "text-amber-600 font-medium mt-2";
                return;
            }
            if (selected.value === "true") {
                resultEl.textContent = "Bravo ! C'est exact.";
                resultEl.className = "text-emerald-700 font-medium mt-2";
            } else {
                resultEl.textContent = "Incorrect. Essayez encore !";
                resultEl.className = "text-rose-700 font-medium mt-2";
            }
        }


        // =========================================================
        // 2. INITIALISATION DES DONNÉES (S'exécute au chargement)
        // =========================================================
        document.addEventListener("DOMContentLoaded", () => {
            
            const simplesContainer = document.getElementById('tab-simples');
            const ornementauxContainer = document.getElementById('tab-ornementaux');
            const visualGrid = document.getElementById('visual-grid');

            if (siteData.neumes && Array.isArray(siteData.neumes)) {
                siteData.neumes.forEach((n, index) => {
                    const neumeId = 'neume-' + index;

                    const badge = document.createElement('div');
                    badge.className = "flex items-center space-x-2 p-2 border border-stone-200 bg-stone-50 rounded hover:bg-amber-100 cursor-pointer transition text-xs font-medium text-stone-700";
                    badge.onclick = () => {
                        showPage('neumes');
                        switchNeumeTab(n.categorie);
                        setTimeout(() => {
                            const el = document.getElementById(neumeId);
                            if(el) {
                                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                el.classList.add('ring-2', 'ring-amber-700', 'bg-amber-50');
                                setTimeout(() => el.classList.remove('ring-2', 'ring-amber-700', 'bg-amber-50'), 2500);
                            }
                        }, 100);
                    };
                    
                    let badgeImg = '';
                    if(n.images && n.images.length > 0) badgeImg = `<img src="${n.images[0]}" alt="${n.nom}" class="h-6 w-6 object-contain">`;
                    else if(n.image) badgeImg = `<img src="${n.image}" alt="${n.nom}" class="h-6 w-6 object-contain">`;
                    
                    badge.innerHTML = `${badgeImg}<span>${n.nom}</span>`;
                    if (visualGrid) visualGrid.appendChild(badge);

                    const card = document.createElement('div');
                    card.id = neumeId;
                    card.className = "neume-card bg-white p-6 rounded-lg shadow-sm border border-stone-200 space-y-3 transition duration-300";
                    
                    let html = `<h3 class="font-bold text-lg text-amber-800">${n.nom}</h3>`;
                    
                    if(n.images && Array.isArray(n.images)) {
                        html += `<div class="flex flex-wrap gap-2 my-2">`;
                        n.images.forEach(img => {
                            html += `<img src="${img}" alt="${n.nom}" class="h-20 object-contain rounded">`;
                        });
                        html += `</div>`;
                    } else if(n.image) {
                        html += `<img src="${n.image}" alt="${n.nom}" class="h-24 object-contain my-2 rounded">`;
                    }

                    html += `<p class="text-sm text-stone-600 whitespace-pre-line text-justify">${n.description}</p>`;
                    card.innerHTML = html;

                    if(n.categorie === 'simples' && simplesContainer) simplesContainer.appendChild(card);
                    if(n.categorie === 'ornementaux' && ornementauxContainer) ornementauxContainer.appendChild(card);
                });
            }

            const lettresContainer = document.getElementById('lettres-container');
            if (siteData.lettres && lettresContainer) {
                siteData.lettres.forEach(l => {
                    const div = document.createElement('div');
                    div.className = "border-b border-stone-100 pb-4 last:border-0";
                    let lHtml = `<h3 class="font-bold text-amber-800 text-lg mb-1">${l.sigle}</h3>`;
                    lHtml += `<p class="text-stone-600 text-sm mb-2 text-justify">${l.texte}</p>`;
                    if(l.image) {
                        lHtml += `<img src="${l.image}" alt="${l.sigle}" class="h-16 object-contain rounded my-2">`;
                    }
                    div.innerHTML = lHtml;
                    lettresContainer.appendChild(div);
                });
            }

            if (siteData.analyseChant) {
                const titreEl = document.getElementById('analyse-titre');
                const descEl = document.getElementById('analyse-desc');
                if (titreEl) titreEl.textContent = siteData.analyseChant.titre;
                if (descEl) descEl.textContent = siteData.analyseChant.description;
                
                if(siteData.analyseChant.audioGlobal) {
                    document.getElementById('audio-container').classList.remove('hidden');
                    document.getElementById('audio-player').src = siteData.analyseChant.audioGlobal;
                }
                if(siteData.analyseChant.imageGlobale) {
                    document.getElementById('image-container').classList.remove('hidden');
                    document.getElementById('manuscrit-img').src = siteData.analyseChant.imageGlobale;
                }
                const etapesList = document.getElementById('etapes-list');
                if (etapesList && siteData.analyseChant.etapes) {
                    siteData.analyseChant.etapes.forEach(e => {
                        const row = document.createElement('div');
                        row.className = "pt-4 flex flex-col md:flex-row justify-between items-start md:items-center";
                        row.innerHTML = `
                            <div class="font-mono bg-stone-100 px-3 py-1 rounded text-amber-900 font-bold mb-2 md:mb-0">${e.signe}</div>
                            <p class="text-sm text-stone-600 md:w-2/3">${e.explications}</p>
                        `;
                        etapesList.appendChild(row);
                    });
                }
            }

            const quizBox = document.getElementById('quiz-box');
            if(siteData.quiz && siteData.quiz.length > 0 && quizBox) {
                const q = siteData.quiz[0];
                let qHtml = `<p class="font-medium text-stone-800 mb-4">Question : ${q.question}</p><div class="space-y-2">`;
                q.options.forEach((opt) => {
                    qHtml += `
                        <label class="block p-3 rounded border border-stone-200 hover:bg-stone-50 cursor-pointer text-justify">
                            <input type="radio" name="quiz-q" value="${opt.correct}" class="mr-2"> ${opt.texte}
                        </label>`;
                });
                qHtml += `</div><button onclick="checkQuiz()" class="mt-4 bg-amber-700 text-white px-6 py-2 rounded-md font-medium hover:bg-amber-800 transition">Vérifier ma réponse</button>
                          <p id="quiz-result" class="font-medium mt-2"></p>`;
                quizBox.innerHTML = qHtml;
            }

            // =========================================================
            // FONCTION UNIVERSELLE POUR GÉNÉRER LES PAGES DYNAMIQUES
            // =========================================================
            function genererPageDynamique(containerId, donneesArray) {
                const container = document.getElementById(containerId);
                if (!container || !donneesArray) return; 
                
                // Petite sécurité si le fichier JS contient une erreur de format JSON
                if (!Array.isArray(donneesArray)) {
                    console.warn(`Attention: Les données pour ${containerId} ne sont pas un tableau.`);
                    return;
                }

                let tableauNotes = [];
                let compteurNotes = 1;

                function formaterTexte(texte) {
                    if (!texte) return "";
                    let res = texte;
                    
                    // 1. LES LIENS INTERNES : [lien=nomPage]Le mot[/lien]
                    while (res.includes("[lien=") && res.includes("[/lien]")) {
                        let indexDebut = res.indexOf("[lien=");
                        let indexFin = res.indexOf("[/lien]");
                        
                        if (indexDebut !== -1 && indexFin !== -1 && indexDebut < indexFin) {
                            let indexFinCrochet = res.indexOf("]", indexDebut);
                            if (indexFinCrochet !== -1 && indexFinCrochet < indexFin) {
                                let texteAvant = res.substring(0, indexDebut);
                                let pageCible = res.substring(indexDebut + 6, indexFinCrochet);
                                let texteLien = res.substring(indexFinCrochet + 1, indexFin);
                                let texteApres = res.substring(indexFin + 7);
                                
                                let boutonHTML = '<a onclick="showPage(\'' + pageCible + '\')" class="text-amber-700 font-bold hover:text-amber-900 hover:underline cursor-pointer transition-colors">' + texteLien + '</a>';
                                res = texteAvant + boutonHTML + texteApres;
                            } else { break; }
                        } else { break; }
                    }

                    // 2. LES LIENS E-CODICES : [p.XXX]
                    while (res.includes("[p.") && res.includes("]")) {
                        let indexDebut = res.indexOf("[p.");
                        let indexFin = res.indexOf("]", indexDebut);
                        
                        if (indexDebut !== -1 && indexFin !== -1 && indexFin > indexDebut) {
                            let texteAvant = res.substring(0, indexDebut);
                            let pageId = res.substring(indexDebut + 3, indexFin);
                            let texteApres = res.substring(indexFin + 1);
                            
                            let lienEcodices = '<a href="https://www.e-codices.unifr.ch/fr/sbe/0121/' + pageId + '/0/" target="_blank" class="ml-2 text-sm text-amber-700 hover:text-amber-900 underline font-medium">p.' + pageId + '</a>';
                            res = texteAvant + lienEcodices + texteApres;
                        } else { break; }
                    }

                    // 3. LES NOTES DE BAS DE PAGE : [note]Mon texte[/note]
                    while (res.includes("[note]") && res.includes("[/note]")) {
                        let indexDebut = res.indexOf("[note]");
                        let indexFin = res.indexOf("[/note]");
                        
                        if (indexDebut !== -1 && indexFin !== -1 && indexDebut < indexFin) {
                            let texteAvant = res.substring(0, indexDebut);
                            let texteNote = res.substring(indexDebut + 6, indexFin);
                            let texteApres = res.substring(indexFin + 7);
                            
                            let num = compteurNotes;
                            tableauNotes.push(texteNote);
                            compteurNotes++;
                            
                            let appel = '<sup id="appel-' + containerId + '-' + num + '" class="ml-0.5"><a href="#note-' + containerId + '-' + num + '" class="text-amber-700 font-bold text-xs hover:text-amber-900 transition-colors">' + num + '</a></sup>';
                            res = texteAvant + appel + texteApres;
                        } else { break; }
                    }

                    return res;
                }

                container.innerHTML = "";

                donneesArray.forEach((bloc) => {
                    if (bloc.type === 'text') {
                        container.innerHTML += `<p class="mb-6">${formaterTexte(bloc.content)}</p>`;
                    }
                    else if (bloc.type === 'titre') {
                        container.innerHTML += `<h3 class="text-xl font-serif font-bold text-stone-900 mt-8 mb-4">${formaterTexte(bloc.content)}</h3>`;
                    }
                    else if (bloc.type === 'image') {
                        container.innerHTML += `
                            <div class="my-6 text-center">
                                <img src="${bloc.src}" alt="Illustration" class="w-full md:w-[700px] h-auto object-contain mx-auto rounded shadow-sm border border-stone-200 bg-stone-50 p-2">
                                <p class="text-xs text-stone-500 mt-2 italic">${bloc.legende}</p>
                            </div>
                        `;
                    }
                    else if (bloc.type === 'imageCompare') {
                        container.innerHTML += `
                            <div class="my-6 text-center">
                                <div class="relative w-full md:w-[700px] mx-auto rounded shadow-sm border border-stone-200 bg-stone-50 p-2 group cursor-pointer">
                                    <img src="${bloc.annotee}" alt="Manuscrit annoté" class="absolute top-2 left-2 right-2 bottom-2 w-[calc(100%-1rem)] h-[calc(100%-1rem)] object-contain rounded">
                                    <img src="${bloc.original}" alt="Manuscrit original" class="relative z-10 w-full h-auto object-contain rounded bg-stone-50 transition-opacity duration-500 group-hover:opacity-0">
                                </div>
                                <p class="text-xs text-stone-500 mt-2 italic">${bloc.legende}</p>
                            </div>
                        `;
                    }
                    else if (bloc.type === 'youtube') {
                        container.innerHTML += `
                            <div class="my-8 max-w-3xl mx-auto shadow-md rounded-lg overflow-hidden border border-stone-200">
                                <iframe class="w-full aspect-video" src="https://www.youtube.com/embed/${bloc.id}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                            </div>
                        `;
                    }
                    else if (bloc.type === 'accordeon') {
                        const couleurTitre = bloc.couleurTitre ? bloc.couleurTitre : '#d97706';
                        const htmlTraduction = bloc.traduction ? `<div class="text-sm md:text-base font-normal mt-1 opacity-90">${bloc.traduction}</div>` : '';
                        const contenuFormate = formaterTexte(bloc.contenu);

                        container.innerHTML += `
                            <details class="group mb-4 bg-white rounded-lg shadow-sm border border-stone-200">
                                <summary class="list-none cursor-pointer p-4 font-serif hover:bg-stone-50 transition flex justify-between items-center outline-none [&::-webkit-details-marker]:hidden" style="color: ${couleurTitre};">
                                    <div>
                                        <div class="font-bold text-xl md:text-2xl">${bloc.titre}</div>
                                        ${htmlTraduction}
                                    </div>
                                    <span class="text-stone-400 group-open:rotate-180 transition-transform duration-300 text-xl ml-4">▼</span>
                                </summary>
                                <div class="p-6 border-t border-stone-100 text-stone-700 leading-relaxed bg-stone-50/50">
                                    ${contenuFormate}
                                </div>
                            </details>
                        `;
                    }
                });

                // --- GÉNÉRATION DES NOTES EN BAS DE PAGE ---
                if (tableauNotes.length > 0) {
                    let htmlNotes = `
                        <div class="mt-12 pt-6 border-t border-stone-200">
                            <h4 class="font-serif font-bold text-lg text-stone-900 mb-4">Notes et références</h4>
                            <ol class="space-y-2 text-sm text-stone-600 list-decimal list-inside">
                    `;
                    
                    tableauNotes.forEach((note, index) => {
                        const num = index + 1;
                        htmlNotes += `
                            <li id="note-${containerId}-${num}" class="leading-relaxed">
                                <span class="inline">${note}</span>
                                <a href="#appel-${containerId}-${num}" class="text-amber-700 font-bold hover:underline ml-2" title="Retourner au texte">^</a>
                            </li>
                        `;
                    });

                    htmlNotes += `
                            </ol>
                        </div>
                    `;
                    container.innerHTML += htmlNotes;
                }
            }

            // --- APPEL DE LA FONCTION POUR TOUTES TES PAGES ---
            genererPageDynamique('lettres-apprendre-contenu', siteData.lettresApprendre || siteData.en_apprendre_plus);
            genererPageDynamique('historique-contenu', siteData.historique);
            genererPageDynamique('manuscrits-contenu', siteData.se_reperer || siteData.seReperer);
            genererPageDynamique('types-pieces-contenu', siteData.types_de_pieces || siteData.typesPieces);
            genererPageDynamique('notations-contenu', siteData.notations);
            genererPageDynamique('modes-contenu', siteData.modes);
            genererPageDynamique('psalmodies-contenu', siteData.psalmodies);
            genererPageDynamique('monocorde-contenu', siteData.monocorde);
            genererPageDynamique('catalogue-fetes-contenu', siteData.catalogue_des_fetes || siteData.catalogueFetes);
            genererPageDynamique('trier-categories-contenu', siteData.trier_par_categories || siteData.trierCategories);
            genererPageDynamique('bibliographie-contenu', siteData.bibliographie);
            genererPageDynamique('sitographie-contenu', siteData.sitographie);
            genererPageDynamique('manuscrit-carre-contenu', siteData.manuscrit_carre || siteData.manuscritCarre);
            genererPageDynamique('carre-manuscrit-contenu', siteData.carre_manuscrit || siteData.carreManuscrit);
            genererPageDynamique('je-debute-contenu', siteData.je_debute || siteData.jeDebute);
            
        });
    </script>
